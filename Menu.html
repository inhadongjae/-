<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>메뉴 추천</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 헤더 */
    .page-header {
      background: #fff;
      padding: 20px 24px 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .page-header h2 { font-size: 20px; font-weight: 500; }
    .header-right { display: flex; align-items: center; gap: 12px; position: relative; }
    .icon-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; }

    /* 드롭다운 */
    .dropdown {
      display: none;
      position: absolute;
      top: 36px; right: 0;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 200;
      min-width: 140px;
      overflow: hidden;
    }
    .dropdown.show { display: block; }
    .dropdown-item { padding: 13px 18px; font-size: 15px; cursor: pointer; border-bottom: 1px solid #f5f5f5; }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:active { background: #f5f5f5; }

    /* 날짜바 */
    .date-bar {
      background: #fff;
      padding: 10px 24px;
      text-align: right;
      font-size: 15px;
      color: #555;
      border-bottom: 1px solid #eee;
    }

    /* 추천 카드 고정 */
    .recommend-fixed {
      background: #fff;
      border-bottom: 1px solid #eee;
      padding: 12px 16px;
    }
    .recommend-card {
      background: #fff;
      border-radius: 12px;
      border: 2px solid #f6c90e;
      padding: 14px 18px;
    }
    .recommend-header { font-size: 15px; font-weight: 600; color: #b8860b; margin-bottom: 8px; }
    .recommend-sub { font-size: 13px; color: #888; margin-bottom: 6px; }
    .recommend-empty { font-size: 13px; color: #aaa; }
    .meal-items-sm { font-size: 13px; color: #444; line-height: 1.7; }

    /* 슬라이더 */
    .slider-wrap { overflow: hidden; width: 100%; }
    .slider {
      display: flex;
      transition: transform 0.3s ease;
      width: 300%;
    }
    .slide {
      width: 33.333%;
      flex-shrink: 0;
      padding: 16px;
      padding-bottom: 60px;
    }

    /* 식당 레이블 */
    .canteen-label { font-size: 13px; color: #888; margin-bottom: 12px; font-weight: 500; }

    /* 식사 카드 */
    .meal-card {
      background: #fff;
      border-radius: 12px;
      border: 1.5px solid #ddd;
      padding: 18px 20px;
      margin-bottom: 8px;
    }
    .meal-header { display: flex; align-items: center; margin-bottom: 10px; }
    .meal-title { font-size: 15px; font-weight: 500; }
    .meal-time { font-size: 12px; color: #888; margin-left: auto; }
    .meal-items { font-size: 13px; color: #444; line-height: 1.8; }
    .breakfast .meal-title { color: #e53935; }
    .lunch .meal-title { color: #f57f17; }
    .dinner .meal-title { color: #1565c0; }

    /* 선호도 */
    .pref-card {
      background: #fff;
      border-radius: 12px;
      border: 1.5px solid #ddd;
      padding: 18px 20px;
      margin-bottom: 8px;
    }
    .pref-card-title { font-size: 15px; font-weight: 500; margin-bottom: 12px; color: #333; }
    .pref-empty { font-size: 14px; color: #aaa; text-align: center; padding: 16px 0; }
    .chip-inline {
      display: inline-block; padding: 2px 10px; border-radius: 99px;
      font-size: 12px; font-weight: 500; margin: 2px;
      background: #e8f0fd; border: 1px solid #3182ce; color: #3182ce;
    }
    .chip-inline.dc { background: #fee2e2; border-color: #dc2626; color: #dc2626; }
    .chip-inline.dislike { background: #fef3c7; border-color: #d97706; color: #d97706; }
    .chip-inline.unavailable { background: #f3e8ff; border-color: #7c3aed; color: #7c3aed; }
    .pref-setting-btn {
      width: 100%; padding: 12px; border: 1.5px solid #111;
      border-radius: 8px; background: #fff; font-size: 15px; cursor: pointer; margin-top: 8px;
    }
    .pref-setting-btn:active { background: #f0f0f0; }

    /* 하단 점 */
    .dots {
      position: fixed;
      bottom: 16px; left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 10;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ddd;
      transition: background 0.2s;
      cursor: pointer;
    }
    .dot.active { background: #3182ce; }

    /* 업로드 모달 */
    .modal-overlay {
      display: none; position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); z-index: 300;
      align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 28px 24px; width: 88%; }
    .modal h3 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
    .modal p { font-size: 13px; color: #888; margin-bottom: 20px; }
    .upload-area {
      border: 2px dashed #ccc; border-radius: 10px; padding: 32px 16px;
      text-align: center; cursor: pointer; margin-bottom: 20px;
    }
    .upload-area.has-image { border-color: #2e7d32; padding: 8px; }
    .upload-icon { font-size: 36px; margin-bottom: 8px; }
    .upload-text { font-size: 14px; color: #888; }
    .upload-area img { width: 100%; border-radius: 8px; display: none; }
    .upload-area.has-image img { display: block; }
    .upload-area.has-image .upload-icon,
    .upload-area.has-image .upload-text { display: none; }
    .modal-btns { display: flex; gap: 10px; }
    .modal-btn { flex: 1; padding: 12px; border: 1.5px solid #111; border-radius: 8px; background: #fff; font-size: 15px; cursor: pointer; }
    .modal-btn.confirm { background: #111; color: #fff; }
    .modal-btn.confirm:disabled { opacity: 0.35; cursor: not-allowed; }
    .modal-btn:active { opacity: 0.8; }

    /* AI 분석 로딩 오버레이 */
    .analyzing-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 400;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .analyzing-overlay.show { display: flex; }
    .analyzing-spinner {
      width: 52px; height: 52px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .analyzing-text { color: #fff; font-size: 16px; font-weight: 600; }
    .analyzing-sub  { color: rgba(255,255,255,0.6); font-size: 13px; }

    /* AI 분석 완료 배지 */
    .ai-badge {
      display: inline-block;
      font-size: 10px;
      background: #e8f5e9;
      border: 1px solid #2e7d32;
      color: #2e7d32;
      padding: 1px 7px;
      border-radius: 99px;
      margin-left: 6px;
      font-weight: 600;
      vertical-align: middle;
    }

    /* 토스트 메시지 */
    .toast {
      position: fixed;
      bottom: 44px; left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #222; color: #fff;
      font-size: 13px; padding: 9px 20px;
      border-radius: 99px;
      z-index: 500;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="page-header">
    <h2>메뉴 추천</h2>
    <div class="header-right">
      <button class="icon-btn" onclick="location.href='index.html'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H15v-5h-6v5H4a1 1 0 0 1-1-1V9.5z"/>
        </svg>
      </button>
      <button class="icon-btn" onclick="toggleDropdown()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="dropdown" id="dropdown">
        <div class="dropdown-item" onclick="location.href='timetable.html'">내 시간표</div>
        <div class="dropdown-item" onclick="location.href='preference.html'">선호도 설정</div>
        <div class="dropdown-item" onclick="openUploadModal()">메뉴 업로드</div>
      </div>
    </div>
  </div>

  <div class="date-bar" id="date-bar"></div>

  <!-- 추천 카드 고정 -->
  <div class="recommend-fixed">
    <div class="recommend-card">
      <div class="recommend-header">⭐ 추천</div>
      <div id="recommend-content"></div>
    </div>
  </div>

  <!-- 슬라이더 -->
  <div class="slider-wrap">
    <div class="slider" id="slider">

      <!-- 슬라이드 0: 내 메뉴 선호도 -->
      <div class="slide">
        <div class="pref-card">
          <div class="pref-card-title">내 메뉴 선호도</div>
          <div id="pref-body"></div>
          <button class="pref-setting-btn" onclick="location.href='preference.html'">설정하기</button>
        </div>
      </div>

      <!-- 슬라이드 1: 기숙사 식당 -->
      <div class="slide">
        <div class="canteen-label">🏠 기숙사 식당</div>
        <div id="dorm-meals"></div>
      </div>

      <!-- 슬라이드 2: 교직원 식당 -->
      <div class="slide">
        <div class="canteen-label">🏢 교직원 식당</div>
        <div id="staff-meals"></div>
      </div>

    </div>
  </div>

  <!-- 하단 점 -->
  <div class="dots">
    <div class="dot active" id="dot-0" onclick="goToSlide(0)"></div>
    <div class="dot" id="dot-1" onclick="goToSlide(1)"></div>
    <div class="dot" id="dot-2" onclick="goToSlide(2)"></div>
  </div>

  <!-- 업로드 모달 -->
  <div class="modal-overlay" id="upload-modal" onclick="closeModalOutside(event)">
    <div class="modal">
      <h3>📷 메뉴 이미지 업로드</h3>
      <p>식단표 사진을 올리면 AI가 메뉴를 자동으로 읽고<br>추천 메뉴를 즉시 업데이트해요.</p>
      <div class="upload-area" id="upload-area" onclick="triggerFileInput()">
        <div class="upload-icon">📷</div>
        <div class="upload-text">이미지를 탭하여 업로드</div>
        <img id="preview-img" src="" alt="미리보기" />
      </div>
      <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="handleFile(event)" />
      <div class="modal-btns">
        <button class="modal-btn" onclick="closeUploadModal()">취소</button>
        <button class="modal-btn confirm" id="confirm-btn" disabled onclick="confirmUpload()">AI 분석 시작</button>
      </div>
    </div>
  </div>

  <!-- AI 분석 로딩 오버레이 -->
  <div class="analyzing-overlay" id="analyzing-overlay">
    <div class="analyzing-spinner"></div>
    <div class="analyzing-text">AI가 식단표를 분석하는 중...</div>
    <div class="analyzing-sub">잠깐만 기다려주세요</div>
  </div>

  <!-- 토스트 -->
  <div class="toast" id="toast"></div>

  <script>
    // 날짜
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const today = new Date();
    document.getElementById('date-bar').textContent =
      (today.getMonth() + 1) + '월 ' + today.getDate() + '일 ' + days[today.getDay()] + '요일';

    // 임시 메뉴 데이터 (AI 분석 전 기본값)
    let dormMeals = [
      { type: 'breakfast', title: '아침', emoji: '🌅', time: '07:30~09:00', items: '모닝브래드종&잼, 스크램블에그, 계절 과일,\n그린샐러드&드레싱, 시리얼&우유', aiParsed: false },
      { type: 'lunch', title: '점심', emoji: '☀️', time: '11:30~13:30', items: '소고기콩나물밥&양념장, 미역국,\n청양돌그함땅&케찹, 마늘쫑햄볶음,\n실곤약야채무침, 포기김치', aiParsed: false },
      { type: 'dinner', title: '저녁', emoji: '🌙', time: '17:30~19:30', items: '자장덮밥, 달걀국, 칠리탕수육, 연유꽃빵,\n파김치', aiParsed: false }
    ];
    let staffMeals = [
      { type: 'breakfast', title: '아침', emoji: '🌅', time: '07:30~09:00', items: '토스트, 오렌지주스, 요거트, 샐러드', aiParsed: false },
      { type: 'lunch', title: '점심', emoji: '☀️', time: '11:30~13:30', items: '된장찌개, 제육볶음, 시금치나물,\n깍두기, 밥', aiParsed: false },
      { type: 'dinner', title: '저녁', emoji: '🌙', time: '17:30~19:30', items: '김치찌개, 생선구이, 콩나물무침,\n배추김치, 밥', aiParsed: false }
    ];

    // 이전에 AI 분석한 메뉴 캐시 복원
    try {
      const cd = localStorage.getItem('ai_dorm_meals');
      const cs = localStorage.getItem('ai_staff_meals');
      if (cd) dormMeals  = JSON.parse(cd);
      if (cs) staffMeals = JSON.parse(cs);
    } catch(e) {}

    function renderMeals(containerId, meals) {
      const container = document.getElementById(containerId);
      container.innerHTML = meals.map(meal => `
        <div class="meal-card ${meal.type}">
          <div class="meal-header">
            <span class="meal-title">${meal.emoji} ${meal.title}${meal.aiParsed ? ' <span class="ai-badge">AI 분석</span>' : ''}</span>
            <span class="meal-time">${meal.time}</span>
          </div>
          <div class="meal-items">${meal.items.replace(/\n/g, '<br>')}</div>
        </div>
      `).join('');
    }
    renderMeals('dorm-meals', dormMeals);
    renderMeals('staff-meals', staffMeals);

    // 알레르기 키워드 사전
    const ALLERGY_RULES = {
      '우유': ['우유','치즈','버터','크림','요거트','라떼'],
      '토마토': ['토마토','케찹','케첩'],
      '난류': ['달걀','계란','에그','스크램블'],
      '돼지고기': ['돼지','삼겹살','제육','돈육','돈까스','햄','베이컨'],
      '밀': ['밀가루','빵','면','파스타','국수','우동'],
      '새우': ['새우'], '땅콩': ['땅콩','피넛']
    };

    // 추천 카드 업데이트
    const pref = JSON.parse(localStorage.getItem('preference')) || null;

    function computeBestMeal(meals) {
      const todayShort = days[today.getDay()];
      const dayKey = (todayShort==='일'||todayShort==='토') ? '월' : todayShort;
      const SLOT_MAP = { '아침':'8:30', '점심':'12:00', '저녁':'17:30' };
      const blocked = (pref && pref.blockedSlots) ? pref.blockedSlots : {};

      let best = null, bestScore = -Infinity, rejectReason = '';

      meals.forEach(meal => {
        let score = 0, rejected = false, reason = '';

        // 이용 불가 시간대
        if (pref && pref.unavailableTime && meal.title === pref.unavailableTime) {
          rejected = true; reason = `이용 불가 시간대(${meal.title})`;
        }
        // 수업 시간표 차단
        if (!rejected && blocked[dayKey] && blocked[dayKey][SLOT_MAP[meal.title]]) {
          rejected = true; reason = '수업 시간과 겹침';
        }
        // 알레르기
        if (!rejected && pref && pref.allergies) {
          for (const alg of pref.allergies) {
            const kws = ALLERGY_RULES[alg] || [alg];
            if (kws.some(kw => meal.items.includes(kw))) {
              rejected = true; reason = `알레르기 성분 포함(${alg})`; break;
            }
          }
        }
        if (!rejected) {
          if (pref) {
            (pref.likedTypes||[]).forEach(t => { if (meal.items.includes(t)||(t==='한식'&&(meal.items.includes('밥')||meal.items.includes('찌개')))) score+=3; });
            (pref.likedCuisines||[]).forEach(c => { if (meal.items.includes(c)) score+=5; });
            (pref.dislikedCuisines||[]).forEach(c => { if (meal.items.includes(c)) score-=4; });
          }
          if (score > bestScore) { bestScore = score; best = meal; }
        } else {
          if (!best) rejectReason = reason;
        }
      });
      return { meal: best, reason: rejectReason };
    }

    function updateRecommend(slideIdx) {
      const recommendEl = document.getElementById('recommend-content');
      if (slideIdx === 0) {
        recommendEl.innerHTML = pref
          ? '<div class="recommend-empty">식당 탭으로 이동하면 추천 메뉴를 볼 수 있어요.</div>'
          : '<div class="recommend-empty">메뉴 선호도를 설정해주세요.</div>';
        return;
      }
      const meals = slideIdx === 1 ? dormMeals : staffMeals;
      const { meal, reason } = computeBestMeal(meals);
      if (meal) {
        recommendEl.innerHTML = `
          <div class="recommend-sub">${meal.emoji} ${meal.title} ${meal.time}${meal.aiParsed ? ' <span class="ai-badge">AI 분석</span>' : ''}</div>
          <div class="meal-items-sm">${meal.items.replace(/\n/g, '<br>')}</div>
        `;
      } else {
        recommendEl.innerHTML = `<div class="recommend-empty">🔴 추천 불가 — ${reason || '모든 식사가 차단됐어요.'}</div>`;
      }
    }
    updateRecommend(0);

    // 선호도 표시
    const prefBody = document.getElementById('pref-body');
    if (!pref) {
      prefBody.innerHTML = '<div class="pref-empty">선호도를 설정하면 맞춤 메뉴를 추천해드려요!</div>';
    } else {
      let html = '';
      if (pref.likedTypes && pref.likedTypes.length > 0)
        html += `<div style="margin-bottom:10px;"><span style="font-size:13px;color:#555;">선호 유형</span><br>${pref.likedTypes.map(v => `<span class="chip-inline">${v}</span>`).join('')}</div>`;
      if (pref.likedCuisines && pref.likedCuisines.length > 0)
        html += `<div style="margin-bottom:10px;"><span style="font-size:13px;color:#555;">좋아하는 메뉴</span><br>${pref.likedCuisines.map(v => `<span class="chip-inline">${v}</span>`).join('')}</div>`;
      if (pref.dislikedCuisines && pref.dislikedCuisines.length > 0)
        html += `<div style="margin-bottom:10px;"><span style="font-size:13px;color:#555;">싫어하는 메뉴</span><br>${pref.dislikedCuisines.map(v => `<span class="chip-inline dislike">${v}</span>`).join('')}</div>`;
      if (pref.allergies && pref.allergies.length > 0)
        html += `<div style="margin-bottom:10px;"><span style="font-size:13px;color:#555;">알레르기</span><br>${pref.allergies.map(v => `<span class="chip-inline dc">${v}</span>`).join('')}</div>`;

      // 이용 불가 시간대
      const timeEmoji = { 아침: '🌅', 점심: '☀️', 저녁: '🌙' };
      if (pref.unavailableTime) {
        html += `<div style="margin-bottom:10px;"><span style="font-size:13px;color:#555;">이용 불가 시간대</span><br><span class="chip-inline unavailable">${timeEmoji[pref.unavailableTime] || ''} ${pref.unavailableTime}</span></div>`;
      }

      prefBody.innerHTML = html || '<div class="pref-empty">설정된 선호도가 없습니다.</div>';
    }

    // 슬라이더
    let currentSlide = 0;
    const totalSlides = 3;

    function goToSlide(idx) {
      if (idx < 0 || idx >= totalSlides) return;
      currentSlide = idx;
      document.getElementById('slider').style.transform = `translateX(-${idx * 33.333}%)`;
      for (let i = 0; i < totalSlides; i++) {
        document.getElementById('dot-' + i).classList.toggle('active', i === idx);
      }
      updateRecommend(idx);
    }

    // 터치 스와이프
    let touchStartX = 0;
    const sliderWrap = document.querySelector('.slider-wrap');
    sliderWrap.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
    sliderWrap.addEventListener('touchend', e => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) < 50) return;
      if (diff > 0) goToSlide(currentSlide + 1);
      else goToSlide(currentSlide - 1);
    });

    // 마우스 스와이프
    let mouseStartX = 0, isDragging = false;
    sliderWrap.addEventListener('mousedown', e => { mouseStartX = e.clientX; isDragging = true; });
    sliderWrap.addEventListener('mouseup', e => {
      if (!isDragging) return;
      isDragging = false;
      const diff = mouseStartX - e.clientX;
      if (Math.abs(diff) < 50) return;
      if (diff > 0) goToSlide(currentSlide + 1);
      else goToSlide(currentSlide - 1);
    });
    sliderWrap.addEventListener('mouseleave', () => { isDragging = false; });

    // 드롭다운
    function toggleDropdown() {
      document.getElementById('dropdown').classList.toggle('show');
    }
    document.addEventListener('click', e => {
      if (!e.target.closest('.header-right')) {
        document.getElementById('dropdown').classList.remove('show');
      }
    });

    // 업로드 모달
    function openUploadModal() {
      document.getElementById('dropdown').classList.remove('show');
      document.getElementById('upload-modal').classList.add('show');
    }
    function closeUploadModal() {
      document.getElementById('upload-modal').classList.remove('show');
      document.getElementById('upload-area').classList.remove('has-image');
      document.getElementById('preview-img').src = '';
      document.getElementById('file-input').value = '';
      document.getElementById('confirm-btn').disabled = true;
    }
    function closeModalOutside(e) { if (e.target === document.getElementById('upload-modal')) closeUploadModal(); }
    function triggerFileInput() { document.getElementById('file-input').click(); }
    let currentImageBase64 = null;
    let currentImageMime   = 'image/jpeg';

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      currentImageMime = file.type || 'image/jpeg';
      const reader = new FileReader();
      reader.onload = ev => {
        const dataUrl = ev.target.result;
        currentImageBase64 = dataUrl.split(',')[1];
        document.getElementById('preview-img').src = dataUrl;
        document.getElementById('upload-area').classList.add('has-image');
        document.getElementById('confirm-btn').disabled = false;
      };
      reader.readAsDataURL(file);
    }

    // 토스트
    let _toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    async function confirmUpload() {
      if (!currentImageBase64) return;
      closeUploadModal();

      document.getElementById('analyzing-overlay').classList.add('show');

      try {
        // ── 프롬프트: JSON 대신 파이프(|) 구분자 텍스트 포맷으로 요청 ──
        // JSON은 한국어 메뉴명의 특수문자·따옴표·줄바꿈 때문에 파싱 오류가 잦음
        const prompt = `이 이미지는 학교 식당 식단표입니다.
아침(조식)/점심(중식)/저녁(석식) 메뉴를 아래 형식으로 추출하세요.

출력 형식 (이 형식만 출력, 다른 설명 금지):
DORM_BREAKFAST|메뉴1,메뉴2,메뉴3
DORM_LUNCH|메뉴1,메뉴2,메뉴3
DORM_DINNER|메뉴1,메뉴2,메뉴3
STAFF_BREAKFAST|메뉴1,메뉴2,메뉴3
STAFF_LUNCH|메뉴1,메뉴2,메뉴3
STAFF_DINNER|메뉴1,메뉴2,메뉴3

규칙:
- 각 줄은 반드시 위 태그|메뉴 형식으로만 작성
- 메뉴 항목은 쉼표(,)로 구분, 줄바꿈 없이 한 줄
- 기숙사/교직원 구분 불가시 동일 내용 작성
- 메뉴 없는 시간대는 정보없음 으로 작성`;

        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            messages: [{
              role: 'user',
              content: [
                { type: 'image', source: { type: 'base64', media_type: currentImageMime, data: currentImageBase64 } },
                { type: 'text', text: prompt }
              ]
            }]
          })
        });

        if (!res.ok) throw new Error(`API 오류 (${res.status})`);
        const data = await res.json();
        const raw  = (data.content.find(b => b.type === 'text') || {}).text || '';

        // ── 파이프 구분자 텍스트 파싱 (JSON 파싱 오류 원천 차단) ──
        const parseTag = (tag) => {
          const line = raw.split('\n').find(l => l.trim().startsWith(tag + '|'));
          if (!line) return '정보 없음';
          return line.split('|')[1]?.trim() || '정보 없음';
        };

        const TYPE_META = [
          { dormTag: 'DORM_BREAKFAST', staffTag: 'STAFF_BREAKFAST', title: '아침', emoji: '🌅', type: 'breakfast', defaultTime: '07:30~09:00' },
          { dormTag: 'DORM_LUNCH',     staffTag: 'STAFF_LUNCH',     title: '점심', emoji: '☀️', type: 'lunch',     defaultTime: '11:30~13:30' },
          { dormTag: 'DORM_DINNER',    staffTag: 'STAFF_DINNER',    title: '저녁', emoji: '🌙', type: 'dinner',    defaultTime: '17:30~19:30' }
        ];

        dormMeals = TYPE_META.map(m => ({
          type: m.type, title: m.title, emoji: m.emoji,
          time: m.defaultTime,
          items: parseTag(m.dormTag),
          aiParsed: true
        }));
        staffMeals = TYPE_META.map(m => ({
          type: m.type, title: m.title, emoji: m.emoji,
          time: m.defaultTime,
          items: parseTag(m.staffTag),
          aiParsed: true
        }));

        // 캐시 저장 (새로고침해도 유지)
        localStorage.setItem('ai_dorm_meals',  JSON.stringify(dormMeals));
        localStorage.setItem('ai_staff_meals', JSON.stringify(staffMeals));

        // 화면 즉시 갱신
        renderMeals('dorm-meals',  dormMeals);
        renderMeals('staff-meals', staffMeals);
        updateRecommend(currentSlide);

        showToast('✅ AI 분석 완료! 메뉴가 업데이트됐어요.');

      } catch (err) {
        console.error(err);
        showToast('❌ 분석 실패: ' + err.message);
      } finally {
        document.getElementById('analyzing-overlay').classList.remove('show');
        currentImageBase64 = null;
      }
    }
  </script>
</body>
</html>
